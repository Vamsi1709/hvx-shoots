<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>HVX Shoots | Our Memories</title>

  <style>

    /* =========================
       BASIC
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: white;
    }


    /* =========================
       NAVBAR
    ========================= */

    nav {

      position: sticky;
      top: 0;

      z-index: 1000;

      width: 100%;

      padding: 18px 6%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(0, 0, 0, 0.92);

      backdrop-filter: blur(10px);

      border-bottom: 1px solid #222;
    }


    .logo {

      font-size: 28px;

      font-weight: 900;

      letter-spacing: 5px;
    }


    .logo span {

      display: block;

      text-align: center;

      font-size: 9px;

      letter-spacing: 6px;
    }


    nav a {

      color: #e3b55d;

      text-decoration: none;

      border: 1px solid #e3b55d;

      padding: 10px 18px;

      border-radius: 5px;

      transition: 0.3s;
    }


    nav a:hover {

      background: #e3b55d;

      color: #111;
    }


    /* =========================
       HERO
    ========================= */

    .hero {

      text-align: center;

      padding: 90px 5% 60px;

      background:
        linear-gradient(
          #090909,
          #111
        );
    }


    .kicker {

      color: #dcae55;

      letter-spacing: 5px;

      font-size: 12px;

      margin-bottom: 15px;
    }


    .hero h1 {

      font-size:
        clamp(45px, 7vw, 80px);

      letter-spacing: 5px;

      font-weight: 900;
    }


    .hero p {

      color: #aaa;

      margin-top: 15px;

      font-size: 17px;

      line-height: 1.6;
    }


    /* =========================
       MEMORIES SECTION
    ========================= */

    .memories {

      padding: 70px 5%;

      max-width: 1500px;

      margin: auto;
    }


    .section-title {

      color: #dcae55;

      letter-spacing: 5px;

      font-size: 12px;

      margin-bottom: 10px;
    }


    .memories h2 {

      font-size: 40px;

      margin-bottom: 35px;
    }


    /* =========================
       PHOTO GRID
    ========================= */

    .photo-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;
    }


    .photo-card {

      height: 300px;

      overflow: hidden;

      border-radius: 8px;

      background: #151515;

      border: 1px solid #292929;

      cursor: pointer;
    }


    .photo-card img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      display: block;

      opacity: 1;

      transition:
        opacity 0.6s ease,
        transform 0.5s ease;
    }


    .photo-card:hover img {

      transform: scale(1.06);
    }


    /* =========================
       VIEW ALL BUTTON
    ========================= */

    .view-more {

      text-align: center;

      margin-top: 35px;
    }


    .btn {

      display: inline-block;

      padding: 15px 28px;

      background: #e3b55d;

      color: #111;

      text-decoration: none;

      font-weight: bold;

      border-radius: 5px;

      transition: 0.3s;
    }


    .btn:hover {

      background: #f0c978;

      transform: translateY(-2px);
    }


    /* =========================
       BOOKING
    ========================= */

    .booking {

      padding: 75px 5%;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #111,
          #191919
        );
    }


    .booking h2 {

      font-size: 38px;

      margin-bottom: 10px;
    }


    .booking p {

      color: #aaa;

      margin-top: 10px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      text-align: center;

      padding: 30px;

      color: #777;

      background: #050505;

      font-size: 14px;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

      .photo-grid {

        grid-template-columns:
          repeat(2, 1fr);
      }


      .photo-card {

        height: 280px;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 550px) {

      nav {

        padding: 15px 5%;
      }


      .logo {

        font-size: 24px;
      }


      nav a {

        padding: 8px 12px;

        font-size: 13px;
      }


      .hero {

        padding:
          70px 5% 50px;
      }


      .hero h1 {

        font-size: 42px;
      }


      .memories {

        padding:
          55px 5%;
      }


      .memories h2 {

        font-size: 30px;
      }


      .photo-grid {

        grid-template-columns: 1fr 1fr;

        gap: 8px;
      }


      .photo-card {

        height: 190px;
      }


      .booking h2 {

        font-size: 30px;
      }

    }


    /* VERY SMALL MOBILE */

    @media (max-width: 380px) {

      .photo-grid {

        grid-template-columns: 1fr;
      }


      .photo-card {

        height: 280px;
      }

    }

  </style>

</head>


<body>

  <!-- =========================

  <!-- =========================

  <section class="booking">

  <!-- =========================

  ========================= -->

  <footer>

  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>


    /*
      DEMO PHOTO COLLECTIONS

      Each group contains
      4 photos.

      Every 3 seconds,
      the 4 photos change.
    */


    const photoSets = [

      [

        "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1465495976277-4387d4b0e4a6?auto=format&fit=crop&w=1000&q=85"

      ],


      [

        "https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1504150558240-0b4fd8946624?auto=format&fit=crop&w=1000&q=85"

      ],


      [

        "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1465495976277-4387d4b0e4a6?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1000&q=85"

      ],


      [

        "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1000&q=85",

        "https://images.unsplash.com/photo-1504150558240-0b4fd8946624?auto=format&fit=crop&w=1000&q=85"

      ]

    ];



    /*

      GET THE 4 IMAGES

    */


    const images = [

      document.getElementById("photo1"),

      document.getElementById("photo2"),

      document.getElementById("photo3"),

      document.getElementById("photo4")

    ];



    let currentSet = 0;



    /* =========================
       CHANGE PHOTOS
    ========================= */


    function changePhotos() {


      images.forEach(
        (image, index) => {


          /* Fade out */

          image.style.opacity = "0";


          setTimeout(
            () => {


              /* Change image */

              image.src =
                photoSets[currentSet][index];


              /* Fade in */

              image.style.opacity = "1";


            },
            300
          );

        }
      );


      /* Next group */

      currentSet++;


      if (
        currentSet >=
        photoSets.length
      ) {

        currentSet = 0;

      }

    }



    /* FIRST LOAD */

    changePhotos();



    /* CHANGE EVERY 3 SECONDS */

    setInterval(
      changePhotos,
      3000
    );


  </script>


</body>

</html>
